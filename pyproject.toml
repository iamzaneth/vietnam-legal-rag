[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-legal-rag"
version = "0.1.0"
description = "Chatbot RAG tra cứu pháp luật Việt Nam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
crawl = ["playwright>=1.51,<2"]

[project.scripts]
vlr = "vietnam_legal_rag.cli.__main__:main"
vbpl-crawl-one = "vietnam_legal_rag.cli.crawl:main"
vbpl-extract = "vietnam_legal_rag.cli.extract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vietnam_legal_rag.ingestion" = ["schemas/*.json"]
"vietnam_legal_rag.evaluation" = ["golden_invariants.json"]
